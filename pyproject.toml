[project]
# The name the Comfy Registry and `comfy node install` know the pack by. It cannot be changed
# once published, and the Registry asks that it does not contain "ComfyUI".
name = "craterview"
description = "Enhance, denoise, restore and retouch images with CraterView.ai. Each node sends an image to the API and returns the result, with no graphics card or model files."
version = "0.4.45"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Floors, not pins, and the same list as requirements.txt, which is what a hand install and
# ComfyUI Manager read. ComfyUI itself supplies numpy and pillow.
dependencies = ["craterview>=0.4.36", "numpy", "pillow"]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/craterviewai/craterview-comfyui"
Documentation = "https://craterview.ai/comfyui"
"Bug Tracker" = "https://github.com/craterviewai/craterview-comfyui/issues"

[tool.comfy]
PublisherId = "craterviewai"
DisplayName = "CraterView.ai"
Icon = "https://craterview.ai/static/mark-180.png"
